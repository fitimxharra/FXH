  <meta name="apple-mobile-web-app-title" content="FXH CAM" />

  <title>FXH CAM — Public Beta</title>
  <!-- v95: analog camera preview refinement + home Install button -->
  <!-- Public Beta control must load before the camera app -->
  <script src="/assets/beta-control.js?v=95"></script>
  <script type="module" crossorigin src="/assets/app.js?v=95"></script>
  <link rel="stylesheet" crossorigin href="/assets/index.css?v=95">
  <link rel="stylesheet" href="/assets/v95-camera.css?v=95">

  <!-- Basic browser UI protection. This deters casual inspection only; client-side code can never be made completely inaccessible. -->
  <style>
    html, body, #root { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    img { -webkit-user-drag: none; user-drag: none; }
  </style>
  <script>
    (() => {
      const stop = (event) => {
        event.preventDefault();
        event.stopPropagation();
        return false;
      };

      document.addEventListener('contextmenu', stop, true);
      document.addEventListener('dragstart', (event) => {
        const target = event.target;
        if (target && target.closest && target.closest('img, video, canvas')) stop(event);
      }, true);

      document.addEventListener('keydown', (event) => {
        const key = String(event.key || '').toLowerCase();
        const ctrlOrMeta = event.ctrlKey || event.metaKey;
        const devTools =
          event.key === 'F12' ||
          (event.ctrlKey && key === 'u') ||
          (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(key)) ||
          (event.metaKey && event.altKey && ['i', 'j', 'c'].includes(key));

        if (devTools) stop(event);
      }, true);
    })();
  </script>

</head>
<body>
  <div id="root"></div>
</body>
</html>
